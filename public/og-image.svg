<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0A0A0B"/>
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="#111113" stroke="#27272A" stroke-width="2"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Accent Line -->
  <rect x="80" y="100" width="6" height="120" fill="#3B82F6" rx="3"/>

  <!-- Main Title -->
  <text x="110" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-0.02em">Yashasav</text>
  <text x="110" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#9CA3AF">Systems &amp; LLM Inference Engineer</text>

  <!-- Description -->
  <text x="80" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#D1D5DB" width="1000">
    <tspan x="80" dy="0">Deep dives into LLM Inference Runtimes (PagedAttention &amp; RadixAttention),</tspan>
    <tspan x="80" dy="36">Apache Kafka Commit Log Internals, Distributed Systems &amp; High-Throughput Storage.</tspan>
  </text>

  <!-- Pill Tags -->
  <g transform="translate(80, 420)">
    <rect width="210" height="42" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="105" y="26" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#60A5FA" text-anchor="middle">LLM Inference</text>

    <rect x="230" width="190" height="42" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="325" y="26" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#60A5FA" text-anchor="middle">Kafka Internals</text>

    <rect x="440" width="220" height="42" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="550" y="26" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#60A5FA" text-anchor="middle">Distributed Systems</text>

    <rect x="680" width="210" height="42" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="785" y="26" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#60A5FA" text-anchor="middle">IEEE Publications</text>
  </g>

  <!-- Footer domain -->
  <text x="1080" y="540" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#6B7280" text-anchor="end">https://yashasav.dev</text>
</svg>
