<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <rect width="840" height="440" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="36" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">
    THE UNIVERSAL MEMORY HIERARCHY: CPU vs. GPU
  </text>
  <line x1="30" y1="48" x2="810" y2="48" stroke="#21262d" stroke-width="1.5"/>

  <!-- Left Side Badge: Fast, Tiny, Expensive -->
  <g transform="translate(30, 85)">
    <rect width="135" height="54" rx="5" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.2"/>
    <text x="67" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">▲ FASTEST &amp; TINY</text>
    <text x="67" y="40" fill="#bae6fd" font-family="monospace" font-size="9" text-anchor="middle">Near-zero latency</text>
  </g>

  <!-- Right Side Badge: Slow, Huge, Cheap -->
  <g transform="translate(675, 275)">
    <rect width="135" height="54" rx="5" fill="#451a03" stroke="#d97706" stroke-width="1.2"/>
    <text x="67" y="24" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">▼ SLOWEST &amp; HUGE</text>
    <text x="67" y="40" fill="#fef08a" font-family="monospace" font-size="9" text-anchor="middle">High transfer latency</text>
  </g>

  <!-- CENTER PYRAMID (Perfect symmetry around X = 420) -->

  <!-- Tier 1: Registers (Top Triangle) -->
  <polygon points="420,72 315,145 525,145" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="420" y="114" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    Registers
  </text>
  <text x="420" y="132" fill="#bae6fd" font-family="monospace" font-size="9.5" text-anchor="middle">
    Bytes • Sub-nanosecond • ALU Private
  </text>

  <!-- Tier 2: SRAM (Middle Trapezoid) -->
  <polygon points="310,152 530,152 620,238 220,238" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="420" y="182" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
    SRAM (Shared Memory / L1 Cache)
  </text>
  <text x="420" y="202" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
    ~228 KB per SM • ~33 TB/s (Ultra-Fast On-Chip!)
  </text>
  <text x="420" y="222" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">
    The working desk where Tensor Cores execute matrix math
  </text>

  <!-- Tier 3: HBM (Bottom Trapezoid) -->
  <polygon points="215,245 625,245 715,340 125,340" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420" y="278" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">
    HBM3 (High Bandwidth Memory / VRAM)
  </text>
  <text x="420" y="300" fill="#fef08a" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="middle">
    80 GB Capacity • 3.35 TB/s Bandwidth
  </text>
  <text x="420" y="322" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" text-anchor="middle">
    Off-chip storage warehouse. 10x slower bandwidth and higher latency than SRAM!
  </text>

  <!-- Bottom Callout Note Box -->
  <g transform="translate(30, 362)">
    <rect width="780" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="390" y="24" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
      Every SWE knows <tspan fill="#38bdf8" font-weight="bold">Cache vs. RAM</tspan>. On GPUs, the gap between <tspan fill="#10b981" font-weight="bold">SRAM (228 KB)</tspan> and <tspan fill="#f59e0b" font-weight="bold">HBM (80 GB)</tspan> is even more stark.
    </text>
    <text x="390" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">
      FlashAttention's secret: <tspan fill="#34d399" font-weight="bold">Keep all intermediate attention math inside fast SRAM, never touching slow HBM.</tspan>
    </text>
  </g>
</svg>
