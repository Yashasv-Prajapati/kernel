<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <rect width="840" height="420" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="36" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">
    INSIDE THE SM: SRAM TILING AND IMMEDIATE DISCARD OF INTERMEDIATES
  </text>
  <line x1="30" y1="48" x2="810" y2="48" stroke="#21262d" stroke-width="1.5"/>

  <!-- Left: Off-Chip HBM (Storage Reservoir) -->
  <g transform="translate(30, 70)">
    <rect width="180" height="320" rx="6" fill="#161b22" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="14" y="24" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">Off-Chip HBM</text>
    <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Slow Input/Output Tensors</text>

    <!-- Q blocks -->
    <rect x="12" y="52" width="156" height="52" rx="4" fill="#0c4a6e" stroke="#0284c7"/>
    <text x="20" y="72" fill="#bae6fd" font-family="monospace" font-size="10.5" font-weight="bold">Q₁ (4×4) [Tokens 0-3]</text>
    <text x="20" y="90" fill="#94a3b8" font-family="monospace" font-size="10">Q₂ (4×4) [Tokens 4-7]</text>

    <!-- K, V blocks -->
    <rect x="12" y="114" width="156" height="52" rx="4" fill="#713f12" stroke="#d97706"/>
    <text x="20" y="134" fill="#fef08a" font-family="monospace" font-size="10.5" font-weight="bold">K₁, V₁ (4×4)</text>
    <text x="20" y="152" fill="#fef08a" font-family="monospace" font-size="10.5" font-weight="bold">K₂, V₂ (4×4)</text>

    <!-- Output destination -->
    <rect x="12" y="176" width="156" height="130" rx="4" fill="#064e3b" stroke="#059669"/>
    <text x="20" y="196" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="bold">Output Destination</text>
    <text x="20" y="214" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="9.5">Only final O is written:</text>
    <rect x="18" y="226" width="144" height="26" rx="3" fill="#022c22" stroke="#10b981"/>
    <text x="26" y="243" fill="#34d399" font-family="monospace" font-size="10.5" font-weight="bold">O₁ (4×4) [Written Once]</text>
    <rect x="18" y="258" width="144" height="26" rx="3" fill="#022c22" stroke="#10b981"/>
    <text x="26" y="275" fill="#34d399" font-family="monospace" font-size="10.5" font-weight="bold">O₂ (4×4) [Written Once]</text>
    <text x="20" y="298" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="9">Total HBM writes: O(N)</text>
  </g>

  <!-- Right: Inside SM - Fast On-Chip SRAM Boundary Box -->
  <g transform="translate(230, 70)">
    <rect width="580" height="320" rx="8" fill="#064e3b" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="24" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">
      Inside Single SM: On-Chip SRAM Boundary Box (33 TB/s)
    </text>

    <!-- 1. Pinned Q1 -->
    <g transform="translate(20, 36)">
      <rect width="160" height="268" rx="5" fill="#161b22" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="12" y="20" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold">PINNED IN SRAM:</text>
      
      <rect x="10" y="30" width="140" height="34" rx="3" fill="#0c4a6e" stroke="#0284c7"/>
      <text x="16" y="52" fill="#bae6fd" font-family="monospace" font-size="11" font-weight="bold">Q₁ (4×4)</text>

      <text x="12" y="80" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Loaded once from HBM.</text>
      <text x="12" y="96" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Stays pinned in SRAM</text>
      <text x="12" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">  while all K, V blocks</text>
      <text x="12" y="128" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">  stream past it!</text>

      <rect x="10" y="150" width="140" height="100" rx="3" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="16" y="170" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="bold">SRAM Trackers:</text>
      <text x="16" y="190" fill="#e0e7ff" font-family="monospace" font-size="9.5">• Row max: m₁</text>
      <text x="16" y="208" fill="#e0e7ff" font-family="monospace" font-size="9.5">• Row sum: l₁</text>
      <text x="16" y="226" fill="#38bdf8" font-family="monospace" font-size="9.5">• Rescale: α_i</text>
      <text x="16" y="242" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="8.5">Updated in-place in SRAM</text>
    </g>

    <!-- 2. Streaming Workspace -->
    <g transform="translate(195, 36)">
      <rect width="185" height="268" rx="5" fill="#161b22" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="12" y="20" fill="#fbbf24" font-family="monospace" font-size="10.5" font-weight="bold">STREAM &amp; DISCARD:</text>

      <!-- Pass 1 -->
      <rect x="10" y="30" width="165" height="96" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="16" y="48" fill="#fef08a" font-family="monospace" font-size="10" font-weight="bold">Stream 1: (K₁, V₁)</text>
      <text x="16" y="66" fill="#cbd5e1" font-family="monospace" font-size="9.5">• S₁₁ = Q₁ · K₁ᵀ</text>
      <text x="16" y="82" fill="#cbd5e1" font-family="monospace" font-size="9.5">• P₁₁ = exp(S₁₁ - m₁)</text>
      <rect x="14" y="94" width="157" height="24" rx="2" fill="#450a0a" stroke="#f43f5e"/>
      <text x="20" y="110" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="bold">DISCARD! 0 HBM writes!</text>

      <!-- Pass 2 -->
      <rect x="10" y="136" width="165" height="96" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="16" y="154" fill="#fef08a" font-family="monospace" font-size="10" font-weight="bold">Stream 2: (K₂, V₂)</text>
      <text x="16" y="172" fill="#cbd5e1" font-family="monospace" font-size="9.5">• S₁₂ = Q₁ · K₂ᵀ</text>
      <text x="16" y="188" fill="#38bdf8" font-family="monospace" font-size="9.5">• Rescale: α_i = e^(m-m_new)</text>
      <rect x="14" y="200" width="157" height="24" rx="2" fill="#450a0a" stroke="#f43f5e"/>
      <text x="20" y="216" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="bold">DISCARD! 0 HBM writes!</text>

      <text x="12" y="252" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">
        S &amp; P never touch HBM!
      </text>
    </g>

    <!-- 3. Output Accumulator -->
    <g transform="translate(395, 36)">
      <rect width="170" height="268" rx="5" fill="#161b22" stroke="#10b981" stroke-width="1.2"/>
      <text x="12" y="20" fill="#34d399" font-family="monospace" font-size="10.5" font-weight="bold">ACCUMULATOR:</text>

      <rect x="10" y="30" width="150" height="42" rx="3" fill="#064e3b" stroke="#059669"/>
      <text x="16" y="48" fill="#a7f3d0" font-family="monospace" font-size="10.5" font-weight="bold">O₁ (4×4)</text>
      <text x="16" y="62" fill="#6ee7b7" font-family="monospace" font-size="8.5">Updated row-by-row in SRAM</text>

      <text x="12" y="90" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">• O₁ += P₁₁ · V₁</text>
      <text x="12" y="110" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10">• Rescale: O₁[i] *= α_i</text>
      <text x="12" y="130" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">• O₁ += P₁₂ · V₂</text>
      <text x="12" y="150" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="10">• Normalize by l_new[i]</text>

      <!-- Exit Arrow -->
      <rect x="10" y="180" width="150" height="70" rx="4" fill="#047857" stroke="#10b981"/>
      <text x="18" y="204" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">WRITE O₁ TO HBM</text>
      <text x="18" y="222" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="9.5">Written exactly once!</text>
      <text x="18" y="238" fill="#a7f3d0" font-family="monospace" font-size="8.5">Clean O(N) memory traffic</text>
    </g>
  </g>
</svg>
