<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" width="100%" height="100%">
  <rect width="840" height="370" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="30" y="34" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">
    THE MEMORY HIGHWAY: STANDARD ATTENTION vs. FLASHATTENTION
  </text>
  <line x1="30" y1="46" x2="810" y2="46" stroke="#21262d" stroke-width="1.5"/>

  <!-- LANE 1: STANDARD ATTENTION (GRIDLOCK) -->
  <g transform="translate(30, 62)">
    <rect width="780" height="135" rx="8" fill="#161b22" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="16" y="22" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      1. Standard Attention: Gridlocked Memory Bus (O(N²) High-Latency Round-Trips)
    </text>

    <!-- HBM Station Left -->
    <rect x="16" y="34" width="95" height="88" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="63" y="66" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">HBM</text>
    <text x="63" y="82" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">(Slow &amp; Huge)</text>
    <text x="63" y="104" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">80 GB</text>

    <!-- SM Station Right -->
    <rect x="669" y="34" width="95" height="88" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="716" y="66" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">GPU SM</text>
    <text x="716" y="82" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">(Fast &amp; Tiny)</text>
    <text x="716" y="104" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SRAM 228KB</text>

    <!-- Clogged Highway in Between -->
    <rect x="122" y="42" width="536" height="72" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="122" y1="78" x2="658" y2="78" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>

    <!-- Traffic: S and P trucks clogging the road -->
    <!-- Truck 1: S write (N^2) -->
    <rect x="440" y="48" width="100" height="24" rx="4" fill="#991b1b" stroke="#f87171"/>
    <text x="490" y="64" fill="#fee2e2" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">Write S (N²!) ➔</text>

    <!-- Truck 2: S read (N^2) -->
    <rect x="230" y="48" width="100" height="24" rx="4" fill="#7f1d1d" stroke="#f87171"/>
    <text x="280" y="64" fill="#fee2e2" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">⬅ Read S (N²!)</text>

    <!-- Truck 3: P write (N^2) -->
    <rect x="360" y="84" width="100" height="24" rx="4" fill="#991b1b" stroke="#f87171"/>
    <text x="410" y="100" fill="#fee2e2" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">Write P (N²!) ➔</text>

    <!-- Truck 4: P read (N^2) -->
    <rect x="140" y="84" width="100" height="24" rx="4" fill="#7f1d1d" stroke="#f87171"/>
    <text x="190" y="100" fill="#fee2e2" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">⬅ Read P (N²!)</text>

    <!-- Status label -->
    <text x="560" y="99" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">
      TRAFFIC JAM: Memory bound!
    </text>
  </g>

  <!-- LANE 2: FLASHATTENTION (EXPRESS HIGHWAY) -->
  <g transform="translate(30, 212)">
    <rect width="780" height="135" rx="8" fill="#161b22" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="16" y="22" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      2. FlashAttention: Express Open Highway (Only O(N) Total Memory Movement)
    </text>

    <!-- HBM Station Left -->
    <rect x="16" y="34" width="95" height="88" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="63" y="66" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">HBM</text>
    <text x="63" y="82" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">(Stored Data)</text>
    <text x="63" y="104" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">O(N) Read</text>

    <!-- SM Station Right -->
    <rect x="669" y="34" width="95" height="88" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="716" y="56" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">GPU SM</text>
    <text x="716" y="72" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">Tiled Online Softmax</text>
    <rect x="674" y="80" width="85" height="34" rx="4" fill="#042f2e" stroke="#14b8a6"/>
    <text x="716" y="94" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">S &amp; P DISCARDED</text>
    <text x="716" y="106" fill="#5eead4" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">never hit HBM!</text>

    <!-- Clean Highway in Between -->
    <rect x="122" y="42" width="536" height="72" rx="6" fill="#022c22" stroke="#059669" stroke-opacity="0.4"/>
    <line x1="122" y1="78" x2="658" y2="78" stroke="#059669" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.4"/>

    <!-- Fast Vehicles: Small, lightweight blocks -->
    <rect x="150" y="50" width="130" height="22" rx="4" fill="#065f46" stroke="#34d399"/>
    <text x="215" y="65" fill="#ecfdf5" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">Stream Q, K, V blocks ➔</text>

    <rect x="420" y="86" width="115" height="22" rx="4" fill="#065f46" stroke="#34d399"/>
    <text x="477" y="101" fill="#ecfdf5" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">⬅ Stream Output O</text>

    <!-- Clear status label -->
    <text x="310" y="65" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">
      Smooth, uninterrupted bandwidth
    </text>
    <text x="145" y="101" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="9.5">
      Zero intermediate matrices written to memory
    </text>
  </g>
</svg>
