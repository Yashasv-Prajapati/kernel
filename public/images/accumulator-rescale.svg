<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <rect width="840" height="400" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="38" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">
    THE MISSING LINK: ROW-BY-ROW ELEMENTWISE RESCALING OF ACCUMULATOR O
  </text>
  <line x1="30" y1="52" x2="810" y2="52" stroke="#21262d" stroke-width="1.5"/>

  <!-- Subtitle explanation -->
  <text x="30" y="76" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">
    Because Attention Output is <tspan fill="#e2e8f0" font-family="monospace">O_i = Σ P_ij · V_j</tspan>, each row is weighted by the exact same exponents as the sum <tspan fill="#34d399" font-family="monospace">l</tspan>.
  </text>
  <text x="30" y="94" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">
    When a new max <tspan fill="#f59e0b" font-family="monospace">m_new</tspan> arrives for row <tspan font-family="monospace">i</tspan>, <tspan fill="#38bdf8" font-weight="bold">every number in row i of O is simply multiplied by scalar α_i = e^(m_old - m_new)</tspan>:
  </text>

  <!-- Visual Matrix Breakdown -->
  <g transform="translate(40, 115)">
    
    <!-- 1. Old Accumulator Matrix O (4x4) -->
    <g transform="translate(0, 0)">
      <rect width="210" height="175" rx="6" fill="#161b22" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="14" y="24" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Previous O₁ in SRAM (4×4)</text>

      <!-- Rows -->
      <g transform="translate(10, 35)">
        <!-- Row 0 -->
        <rect x="0" y="0" width="190" height="28" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="10" y="19" fill="#e2e8f0" font-family="monospace" font-size="11">Row 0: [ O₀₀ , O₀₁ , O₀₂ , O₀₃ ]</text>

        <!-- Row 1 -->
        <rect x="0" y="34" width="190" height="28" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="10" y="53" fill="#e2e8f0" font-family="monospace" font-size="11">Row 1: [ O₁₀ , O₁₁ , O₁₂ , O₁₃ ]</text>

        <!-- Row 2 -->
        <rect x="0" y="68" width="190" height="28" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="10" y="87" fill="#e2e8f0" font-family="monospace" font-size="11">Row 2: [ O₂₀ , O₂₁ , O₂₂ , O₂₃ ]</text>

        <!-- Row 3 -->
        <rect x="0" y="102" width="190" height="28" rx="4" fill="#0f172a" stroke="#1e293b"/>
        <text x="10" y="121" fill="#e2e8f0" font-family="monospace" font-size="11">Row 3: [ O₃₀ , O₃₁ , O₃₂ , O₃₃ ]</text>
      </g>
    </g>

    <!-- Multiplication Symbol -->
    <text x="235" y="105" fill="#f43f5e" font-family="monospace" font-size="28" font-weight="bold">×</text>

    <!-- 2. Per-Row Rescale Scalars Vector (alpha) -->
    <g transform="translate(275, 0)">
      <rect width="180" height="175" rx="6" fill="#161b22" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="14" y="24" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">Rescale Scalars (α)</text>

      <!-- Vector elements -->
      <g transform="translate(10, 35)">
        <rect x="0" y="0" width="160" height="28" rx="4" fill="#451a03" stroke="#f59e0b"/>
        <text x="12" y="19" fill="#fef08a" font-family="monospace" font-size="11">α₀ = e^(m₀_old - m₀_new)</text>

        <rect x="0" y="34" width="160" height="28" rx="4" fill="#451a03" stroke="#f59e0b"/>
        <text x="12" y="53" fill="#fef08a" font-family="monospace" font-size="11">α₁ = e^(m₁_old - m₁_new)</text>

        <rect x="0" y="68" width="160" height="28" rx="4" fill="#451a03" stroke="#f59e0b"/>
        <text x="12" y="87" fill="#fef08a" font-family="monospace" font-size="11">α₂ = e^(m₂_old - m₂_new)</text>

        <rect x="0" y="102" width="160" height="28" rx="4" fill="#451a03" stroke="#f59e0b"/>
        <text x="12" y="121" fill="#fef08a" font-family="monospace" font-size="11">α₃ = e^(m₃_old - m₃_new)</text>
      </g>
    </g>

    <!-- Equal Symbol -->
    <text x="475" y="105" fill="#10b981" font-family="monospace" font-size="28" font-weight="bold">=</text>

    <!-- 3. Rescaled Accumulator (before adding new block) -->
    <g transform="translate(515, 0)">
      <rect width="245" height="175" rx="6" fill="#161b22" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="24" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">Rescaled O₁ + New Block</text>

      <g transform="translate(10, 35)">
        <rect x="0" y="0" width="225" height="28" rx="4" fill="#064e3b" stroke="#059669"/>
        <text x="10" y="19" fill="#a7f3d0" font-family="monospace" font-size="11">Row 0:  α₀ · O[0, :] + P₁₂[0,:]V₂</text>

        <rect x="0" y="34" width="225" height="28" rx="4" fill="#064e3b" stroke="#059669"/>
        <text x="10" y="53" fill="#a7f3d0" font-family="monospace" font-size="11">Row 1:  α₁ · O[1, :] + P₁₂[1,:]V₂</text>

        <rect x="0" y="68" width="225" height="28" rx="4" fill="#064e3b" stroke="#059669"/>
        <text x="10" y="87" fill="#a7f3d0" font-family="monospace" font-size="11">Row 2:  α₂ · O[2, :] + P₁₂[2,:]V₂</text>

        <rect x="0" y="102" width="225" height="28" rx="4" fill="#064e3b" stroke="#059669"/>
        <text x="10" y="121" fill="#a7f3d0" font-family="monospace" font-size="11">Row 3:  α₃ · O[3, :] + P₁₂[3,:]V₂</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway -->
  <g transform="translate(40, 320)">
    <rect width="760" height="55" rx="6" fill="#1e1b4b" fill-opacity="0.4" stroke="#6366f1" stroke-width="1.2"/>
    <text x="20" y="24" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">
      NO FANCY MATRIX TRICK:
    </text>
    <text x="20" y="44" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11">
      Papers write this as <tspan fill="#38bdf8" font-family="monospace">diag(α) · O</tspan>, but it simply means: <tspan fill="#34d399" font-weight="bold">multiply each row i of your output accumulator by its own scalar α_i</tspan>!
    </text>
  </g>
</svg>
