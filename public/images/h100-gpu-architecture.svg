<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <linearGradient id="hbmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="smGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="460" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title Bar -->
  <text x="30" y="38" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">
    FIGURE 1: NVIDIA H100 (SXM5) PHYSICAL MEMORY &amp; COMPUTE HIERARCHY
  </text>
  <line x1="30" y1="52" x2="810" y2="52" stroke="#21262d" stroke-width="1.5"/>

  <!-- Top: HBM3 Memory -->
  <rect x="50" y="70" width="740" height="85" rx="8" fill="url(#hbmGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="none" filter="url(#shadow)"/>
  <rect x="70" y="85" width="28" height="28" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="77" y="104" fill="#fbbf24" font-family="monospace" font-size="16" font-weight="bold">M</text>
  <text x="110" y="98" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">
    HBM3 (High Bandwidth Memory / VRAM) — 80 GB Capacity
  </text>
  <text x="110" y="122" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
    Off-chip stacked DRAM pool. Holds model weights, KV cache, and input activations.
  </text>
  
  <!-- HBM Bandwidth Badge -->
  <rect x="610" y="85" width="160" height="30" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="690" y="105" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
    3.35 TB/s Bandwidth
  </text>
  <text x="690" y="132" fill="#ef4444" font-family="monospace" font-size="10" text-anchor="middle">
    (The Main Bottleneck)
  </text>

  <!-- Bus Arrows (Data Transfer Channel) -->
  <g transform="translate(420, 160)">
    <!-- Up and down arrows -->
    <line x1="-120" y1="2" x2="-120" y2="40" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="-120,44 -124,36 -116,36" fill="#f43f5e"/>
    <polygon points="-120,-2 -124,6 -116,6" fill="#f43f5e"/>

    <line x1="120" y1="2" x2="120" y2="40" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="120,44 116,36 124,36" fill="#f43f5e"/>
    <polygon points="120,-2 116,6 124,6" fill="#f43f5e"/>

    <rect x="-95" y="10" width="190" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="0" y="26" fill="#e6edf3" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      GPU Memory Bus (Pins)
    </text>
  </g>

  <!-- Bottom: GPU Processor Die (132 SMs) -->
  <rect x="50" y="210" width="740" height="225" rx="8" fill="url(#smGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  
  <text x="70" y="235" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">
    GPU Silicon Die: 132 Streaming Multiprocessors (SMs)
  </text>
  <text x="70" y="253" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
    Where all computation happens. Each SM has private ultra-fast SRAM and Tensor Cores.
  </text>

  <!-- Aggregate Speed Callout -->
  <rect x="580" y="222" width="190" height="26" rx="4" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="675" y="239" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
    ~33 TB/s SRAM Bandwidth (10x!)
  </text>

  <!-- 4 SM Cards -->
  <!-- SM 0 -->
  <g transform="translate(70, 268)">
    <rect width="150" height="150" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="12" y="24" fill="#e6edf3" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">SM 0</text>
    
    <!-- SRAM Box -->
    <rect x="10" y="36" width="130" height="50" rx="4" fill="url(#sramGrad)" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="55" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="bold">SRAM (L1 Cache)</text>
    <text x="20" y="73" fill="#6ee7b7" font-family="monospace" font-size="11">228 KB / SM</text>

    <!-- Tensor Cores Box -->
    <rect x="10" y="94" width="130" height="44" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="20" y="112" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Tensor Cores</text>
    <text x="20" y="128" fill="#94a3b8" font-family="monospace" font-size="10">989 TFLOPS FP16</text>
  </g>

  <!-- SM 1 -->
  <g transform="translate(235, 268)">
    <rect width="150" height="150" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="12" y="24" fill="#e6edf3" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">SM 1</text>
    
    <!-- SRAM Box -->
    <rect x="10" y="36" width="130" height="50" rx="4" fill="url(#sramGrad)" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="55" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="bold">SRAM (L1 Cache)</text>
    <text x="20" y="73" fill="#6ee7b7" font-family="monospace" font-size="11">228 KB / SM</text>

    <!-- Tensor Cores Box -->
    <rect x="10" y="94" width="130" height="44" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="20" y="112" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Tensor Cores</text>
    <text x="20" y="128" fill="#94a3b8" font-family="monospace" font-size="10">989 TFLOPS FP16</text>
  </g>

  <!-- Ellipsis -->
  <g transform="translate(400, 335)">
    <text x="20" y="12" fill="#64748b" font-family="monospace" font-size="20" font-weight="bold">••••••</text>
    <text x="10" y="32" fill="#64748b" font-family="monospace" font-size="10">(128 more SMs)</text>
  </g>

  <!-- SM 131 -->
  <g transform="translate(520, 268)">
    <rect width="150" height="150" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="12" y="24" fill="#e6edf3" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">SM 131</text>
    
    <!-- SRAM Box -->
    <rect x="10" y="36" width="130" height="50" rx="4" fill="url(#sramGrad)" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="55" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="bold">SRAM (L1 Cache)</text>
    <text x="20" y="73" fill="#6ee7b7" font-family="monospace" font-size="11">228 KB / SM</text>

    <!-- Tensor Cores Box -->
    <rect x="10" y="94" width="130" height="44" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="20" y="112" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Tensor Cores</text>
    <text x="20" y="128" fill="#94a3b8" font-family="monospace" font-size="10">989 TFLOPS FP16</text>
  </g>

  <!-- Summary Callout Right -->
  <g transform="translate(685, 275)">
    <rect width="90" height="135" rx="6" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-width="1"/>
    <text x="10" y="25" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="bold">KEY RULE:</text>
    <text x="10" y="46" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="10">Data in HBM</text>
    <text x="10" y="62" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="10">must travel</text>
    <text x="10" y="78" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="10">to SRAM</text>
    <text x="10" y="94" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="10">to be</text>
    <text x="10" y="110" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">computed!</text>
  </g>
</svg>
