<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <rect width="840" height="430" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="36" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">
    STANDARD ATTENTION: 3 KERNELS, 3 WASTEFUL HBM ROUND-TRIPS
  </text>
  <line x1="30" y1="48" x2="810" y2="48" stroke="#21262d" stroke-width="1.5"/>

  <!-- Top Area: 3 CUDA Kernels in tiny SRAM cups -->
  <g transform="translate(30, 68)">
    <!-- Kernel 1 Cup -->
    <g transform="translate(0, 0)">
      <rect width="245" height="135" rx="6" fill="#161b22" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="14" y="24" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="bold">Kernel 1: Score Matmul</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">SRAM: Tiny 228 KB Workspace</text>

      <rect x="10" y="52" width="225" height="70" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="18" y="72" fill="#bae6fd" font-family="monospace" font-size="11">S = Q · Kᵀ / √d</text>
      <text x="18" y="90" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">Kernel ends! SRAM wiped!</text>
      <text x="18" y="108" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="10">Must write S (N×N) to HBM</text>
    </g>

    <!-- Kernel 2 Cup -->
    <g transform="translate(265, 0)">
      <rect width="245" height="135" rx="6" fill="#161b22" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="14" y="24" fill="#fbbf24" font-family="monospace" font-size="11.5" font-weight="bold">Kernel 2: Softmax</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">SRAM: Tiny 228 KB Workspace</text>

      <rect x="10" y="52" width="225" height="70" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="18" y="72" fill="#fef08a" font-family="monospace" font-size="11">P = softmax(S)</text>
      <text x="18" y="90" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">Kernel ends! SRAM wiped!</text>
      <text x="18" y="108" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="10">Must write P (N×N) to HBM</text>
    </g>

    <!-- Kernel 3 Cup -->
    <g transform="translate(535, 0)">
      <rect width="245" height="135" rx="6" fill="#161b22" stroke="#34d399" stroke-width="1.2"/>
      <text x="14" y="24" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">Kernel 3: Output Matmul</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">SRAM: Tiny 228 KB Workspace</text>

      <rect x="10" y="52" width="225" height="70" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="18" y="72" fill="#a7f3d0" font-family="monospace" font-size="11">O = P · V</text>
      <text x="18" y="90" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">Computes output tokens</text>
      <text x="18" y="108" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="10">Writes final O (N×d) to HBM</text>
    </g>
  </g>

  <!-- Middle: Wasteful Arrows Traversing the Memory Bus -->
  <g transform="translate(30, 210)">
    <!-- Arrow 1: Dump S down to HBM -->
    <path d="M 120,0 L 120,70" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="4,4"/>
    <polygon points="120,75 115,65 125,65" fill="#ef4444"/>
    <rect x="65" y="22" width="110" height="22" rx="3" fill="#450a0a" stroke="#ef4444"/>
    <text x="120" y="37" fill="#fca5a5" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">Dump S (N×N) ➔</text>

    <!-- Arrow 2: Read S up to Kernel 2 -->
    <path d="M 325,70 L 325,5" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="4,4"/>
    <polygon points="325,0 320,10 330,10" fill="#f59e0b"/>
    <rect x="270" y="12" width="110" height="22" rx="3" fill="#451a03" stroke="#f59e0b"/>
    <text x="325" y="27" fill="#fef08a" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">⬅ Read S (N×N)</text>

    <!-- Arrow 3: Dump P down to HBM -->
    <path d="M 445,0 L 445,70" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="4,4"/>
    <polygon points="445,75 440,65 450,65" fill="#ef4444"/>
    <rect x="390" y="45" width="110" height="22" rx="3" fill="#450a0a" stroke="#ef4444"/>
    <text x="445" y="60" fill="#fca5a5" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">Dump P (N×N) ➔</text>

    <!-- Arrow 4: Read P up to Kernel 3 -->
    <path d="M 655,70 L 655,5" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="4,4"/>
    <polygon points="655,0 650,10 660,10" fill="#f59e0b"/>
    <rect x="600" y="22" width="110" height="22" rx="3" fill="#451a03" stroke="#f59e0b"/>
    <text x="655" y="37" fill="#fef08a" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">⬅ Read P (N×N)</text>
  </g>

  <!-- Bottom: Big HBM Reservoir -->
  <g transform="translate(30, 305)">
    <rect width="780" height="105" rx="8" fill="#1e1b4b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="26" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">
      Off-Chip HBM (Main Memory) — Huge Capacity (80 GB), but High Latency
    </text>
    <text x="20" y="48" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">
      Because CUDA kernels cannot share SRAM state, intermediate matrices <tspan fill="#f87171" font-weight="bold">S and P</tspan> must be written
    </text>
    <text x="20" y="66" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">
      to HBM and re-read back across the memory bus <tspan fill="#f87171" font-weight="bold">3 separate times</tspan>.
    </text>
    
    <rect x="20" y="76" width="340" height="20" rx="3" fill="#450a0a" stroke="#ef4444"/>
    <text x="30" y="90" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="bold">Total Memory Traffic: O(N²) quadratic bottleneck!</text>
  </g>
</svg>
