<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <rect width="840" height="380" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="38" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">
    THE O(N²) EXPLOSION: MEMORY FOOTPRINT OF S + P MATRICES (32 HEADS, FP16)
  </text>
  <line x1="30" y1="52" x2="810" y2="52" stroke="#21262d" stroke-width="1.5"/>

  <!-- Chart Area -->
  <g transform="translate(70, 75)">
    <!-- Y-Axis Labels -->
    <text x="50" y="30" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">600 GB</text>
    <text x="50" y="70" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">400 GB</text>
    <text x="50" y="130" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">200 GB</text>
    <text x="50" y="195" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">80 GB</text>
    <text x="50" y="240" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">0 GB</text>

    <!-- Axes -->
    <line x1="60" y1="20" x2="60" y2="240" stroke="#334155" stroke-width="1.5"/>
    <line x1="60" y1="240" x2="720" y2="240" stroke="#334155" stroke-width="1.5"/>

    <!-- Grid lines -->
    <line x1="60" y1="130" x2="720" y2="130" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="60" y1="70" x2="720" y2="70" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Dashed H100 80GB Limit Line -->
    <line x1="60" y1="195" x2="720" y2="195" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="520" y="180" width="190" height="24" rx="4" fill="#450a0a" stroke="#f43f5e"/>
    <text x="615" y="196" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      H100 MAX VRAM (80 GB)
    </text>

    <!-- Bar 1: N = 2,048 (0.5 GB) -->
    <g transform="translate(110, 0)">
      <rect x="0" y="238" width="80" height="2" rx="2" fill="#38bdf8"/>
      <text x="40" y="230" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0.5 GB</text>
      <text x="40" y="260" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">N = 2k</text>
      <text x="40" y="275" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Prompt</text>
    </g>

    <!-- Bar 2: N = 8,192 (8.2 GB) -->
    <g transform="translate(250, 0)">
      <rect x="0" y="230" width="80" height="10" rx="2" fill="#38bdf8"/>
      <text x="40" y="222" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">8.2 GB</text>
      <text x="40" y="260" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">N = 8k</text>
      <text x="40" y="275" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Article</text>
    </g>

    <!-- Bar 3: N = 32,768 (131 GB) -->
    <g transform="translate(390, 0)">
      <rect x="0" y="165" width="80" height="75" rx="3" fill="#f59e0b"/>
      <text x="40" y="155" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">131 GB</text>
      <text x="40" y="260" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">N = 32k</text>
      <text x="40" y="275" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">OOM!</text>
    </g>

    <!-- Bar 4: N = 64,000 (524 GB) -->
    <g transform="translate(530, 0)">
      <rect x="0" y="45" width="80" height="195" rx="3" fill="#ef4444"/>
      <text x="40" y="35" fill="#fca5a5" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">524 GB!!</text>
      <text x="40" y="260" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">N = 64k</text>
      <text x="40" y="275" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">FATAL CRASH</text>
    </g>
  </g>
</svg>
